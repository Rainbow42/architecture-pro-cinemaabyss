name: API Tests

on:
  push:
    branches: [ main, master, feature/project-template-tasks ]
  pull_request:
    branches: [ main, master, feature/project-template-tasks ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: bash scripts/ci-compose-up.sh
        timeout-minutes: 20

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs monolith movies-service events-service proxy-service postgres kafka --tail=100

      - name: Run API tests in Docker network
        working-directory: tests/postman
        run: npm run test:docker

      - name: Stop services
        if: always()
        run: docker compose down -v
